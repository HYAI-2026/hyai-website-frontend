<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title / description / canonical / og 등 페이지별 SEO 태그는 각 페이지의 <Seo> 컴포넌트에서 주입합니다. -->
    <!-- 아래 Organization JSON-LD 는 사이트 전체 공통(조직 정체성) 구조화 데이터입니다. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "HYAI",
        "alternateName": [
          "한양대 에리카 소프트웨어융합대학 인공지능학회 HYAI",
          "한양대학교 ERICA 소프트웨어융합대학 인공지능학회 HYAI"
        ],
        "url": "https://www.hyai.kr/",
        "description": "HYAI는 한양대 에리카 소프트웨어융합대학 인공지능학회입니다. HYAI N주특강, HY-GO, 자율그룹스터디, 모각코, 일일세미나, 초청강연 등의 활동을 운영합니다.",
        "department": {
          "@type": "CollegeOrUniversity",
          "name": "한양대 에리카 소프트웨어융합대학"
        },
        "knowsAbout": [
          "파이썬",
          "머신러닝",
          "컴퓨터비전",
          "그래프신경망",
          "강화학습",
          "RAG/Agent"
        ]
      }
    </script>
    <link rel="icon" type="image/png" href="./src/assets/images/hyai.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
